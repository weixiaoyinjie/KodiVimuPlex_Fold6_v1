
name: One-Upload Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Unpack source ZIP
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -name '*.zip' -type f | head -1)
          test -n "$ZIP" || exit 1
          mkdir -p expanded
          unzip -q "$ZIP" -d expanded
          PROJECT=$(find expanded -name settings.gradle -type f | head -1)
          test -n "$PROJECT" || exit 1
          echo "PROJECT=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT"
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/KodiVimuPlex-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KodiVimuPlex-Fold6-debug
          path: KodiVimuPlex-debug.apk

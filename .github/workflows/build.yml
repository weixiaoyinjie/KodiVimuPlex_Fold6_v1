name: KodiVimuPlex - Build APK (SDK Fix)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Use the runner's preinstalled Android SDK and skip extra SDK setup.
      - name: Check preinstalled Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Using Android SDK: $SDK"
          if [ ! -d "$SDK" ]; then
            echo '::error::The runner does not contain an Android SDK'
            exit 1
          fi
          if [ ! -f "$SDK/platforms/android-35/android.jar" ]; then
            echo 'Android API 35 not preinstalled; installing only this platform'
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
            if [ -z "$SDKMANAGER" ]; then
              echo '::error::sdkmanager executable was not found'
              exit 1
            fi
            "$SDKMANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$SDK/platforms/android-35/android.jar"

      - name: Unpack source ZIP from repository root
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo '::error::Please upload KodiVimuPlex_Fold6_v1_Source.zip to the repository root'
            exit 1
          fi
          echo "Unpacking $ZIP"
          mkdir -p "$RUNNER_TEMP/kodi_project"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/kodi_project"
          SETTINGS="$(find "$RUNNER_TEMP/kodi_project" -type f -name settings.gradle -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo '::error::No settings.gradle found inside the source ZIP'
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project located at $PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle"

      - name: Compile Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo '::error::APK missing after Gradle build'; exit 1; }
          cp "$APK" "$GITHUB_WORKSPACE/KodiVimuPlex-Fold6-debug.apk"

      - name: Publish downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: KodiVimuPlex-Fold6-debug
          path: KodiVimuPlex-Fold6-debug.apk
          if-no-files-found: error
